<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · BrickByBrick</title>
    <style>
      :root { color-scheme: light; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f9fafb;
        color: #18181b;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .wrap { max-width: 560px; width: 100%; text-align: center; }
      .eyebrow {
        font-size: 11px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.3em;
        color: #ea580c;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 36px;
        line-height: 1.1;
        font-weight: 900;
        margin: 0 0 12px;
        color: #18181b;
      }
      p { color: #52525b; margin: 0 0 32px; }
      .row { display: flex; gap: 12px; flex-direction: column; align-items: stretch; }
      @media (min-width: 640px) { .row { flex-direction: row; justify-content: center; } }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        padding: 0 24px;
        border-radius: 8px;
        font-weight: 700;
        text-decoration: none;
        font-size: 14px;
      }
      a.primary { background: #000; color: #fff; }
      a.primary:hover { background: #27272a; }
      a.secondary { background: #fff; color: #18181b; border: 1px solid #d4d4d8; }
      a.secondary:hover { background: #f4f4f5; }
      .help { font-size: 12px; color: #71717a; margin-top: 32px; }
      .help a { color: #ea580c; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for does not exist or has been moved.</p>
      <div class="row">
        <a class="btn primary" href="/">Back to home</a>
        <a class="btn secondary" href="/marketplace">Browse marketplace</a>
      </div>
      <p class="help">Need help? <a href="/contact">Contact us</a></p>
    </div>
  </body>
</html>
